name: Bug report
description: Something does not work, or the app crashed or vanished.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Without the log, most reports cannot be acted on, so please include it. Snoop writes the log of its last run to:

        - macOS: `~/Library/Application Support/com.dappermint.snoop/snoop.log`
        - Linux: `~/.local/state/snoop/snoop.log`
        - Windows: `%LOCALAPPDATA%\dappermint\snoop\data\snoop.log`

        If the app crashed or vanished, `panic.log` in the same folder says where it died; include that too. If there is no log file, run `snoop -v` from a terminal (on Windows, `snoop.exe -v` from PowerShell) and paste what it prints instead.
  - type: input
    id: version
    attributes:
      label: Snoop version and how you installed it
      placeholder: "0.3.0 from the DMG / Homebrew / the Windows installer"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows
    validations:
      required: true
  - type: input
    id: os_details
    attributes:
      label: System details
      description: Distribution and desktop on Linux, or the OS version.
      placeholder: "Arch, Hyprland, PipeWire / macOS 15.6 / Windows 11 24H2"
    validations:
      required: true
  - type: dropdown
    id: plan
    attributes:
      label: Spotify plan
      options:
        - Premium
        - Free
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What did you do, and what happened instead?
      placeholder: "1. Signed in. 2. Pressed play on a playlist. 3. Nothing played; the button kept spinning."
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: snoop.log
      description: Reproduce the problem, quit the app, then paste the whole file here (and panic.log, if there is one). Paths are above.
      render: text
    validations:
      required: true
