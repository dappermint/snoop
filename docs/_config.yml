title: Snoop
snoop_version: "0.3.0"
description: A mac-first, native Spotify client written in Rust. A fork of Fastpotify.
lang: en-US
timezone: Europe/Berlin
url: https://dappermint.github.io
baseurl: "/snoop"
logo: /assets/images/logo.svg
image: /screenshot.png

markdown: kramdown
kramdown:
  input: GFM

permalink: pretty
theme: jekyll-vitepress-theme

collections:
  guide:
    output: true
    permalink: "/:name/"
  reference:
    output: true
    permalink: "/:name/"

defaults:
  - scope:
      path: ""
    values:
      layout: default
      image: /screenshot.png
      topics:
        - Spotify client
        - Rust
        - egui
        - librespot
        - Spotify Connect
        - Linux music player
  - scope:
      type: guide
    values:
      layout: default
  - scope:
      type: reference
    values:
      layout: default

jekyll_vitepress:
  seo:
    page_type: TechArticle
    image:
      path: /screenshot.png
      alt: Snoop showing a playlist with the queue open and a track playing
    publisher:
      type: Person
      name: dappermint
      same_as:
        - https://github.com/dappermint/snoop
  llms:
    title: Snoop
    description: >-
      Documentation for Snoop, a mac-first native Spotify client written in
      Rust with egui and librespot: one lightweight app for your whole
      library, local playback, and Spotify Connect. A fork of Fastpotify.
    full: true
    details: >-
      The canonical documentation covers installation, signing in, everyday
      use, settings, and how the client connects to Spotify. Source is on
      [GitHub](https://github.com/dappermint/snoop).
  branding:
    site_title: Snoop
    logo:
      default: /assets/images/logo.svg
      alt: Snoop
  syntax:
    light_theme: github
    dark_theme: github.dark
  footer:
    enabled: true
    show_on_docs: false
    message: >-
      A mac-first fork of <a href="https://github.com/crmne/fastpotify" target="_blank" rel="noreferrer">Fastpotify</a> by
    copyright: >-
      <span class="footer-built-with">Docs built with <a href="https://jekyll-vitepress.dev" target="_blank" rel="noreferrer">Jekyll VitePress</a>. Snoop is an independent project, not affiliated with or endorsed by Spotify AB. Spotify is a trademark of Spotify AB.</span>
  doc_footer:
    enabled: true
    previous_label: Previous page
    next_label: Next page
  last_updated:
    enabled: true
    text: Last updated
    format: "%Y-%m-%d %H:%M"
  edit_link:
    enabled: true
    pattern: "https://github.com/dappermint/snoop/edit/main/docs/:path"
    text: Edit this page on GitHub
  github_star:
    enabled: true
    repository: dappermint/snoop
    text: Star
    show_count: true

plugins:
  - jekyll-vitepress-theme

exclude:
  - _site
  - .jekyll-cache
  - .sass-cache
  - .bundle
  - vendor
  - Gemfile
  - Gemfile.lock
